# The same levels as log4j2.xml, in the properties format.
# Run with: mvn -q exec:java -Dlog4j2.configurationFile=src/main/resources/properties-format/log4j2.properties
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5level %c{1} - %msg%n

# Our own recipes package prints DEBUG and above
logger.recipes.name = com.howtodoinjava.levels.recipes
logger.recipes.level = DEBUG

# Everything else prints WARN and above
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = Console
