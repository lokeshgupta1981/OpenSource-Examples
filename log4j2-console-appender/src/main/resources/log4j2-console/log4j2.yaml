# Needs the jackson-databind and jackson-dataformat-yaml dependencies
Configuration:
  Appenders:
    Console:
      name: console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{HH:mm:ss.SSS} %-5level [%t] %logger{1} - %msg%n"
  Loggers:
    Root:
      level: info
      AppenderRef:
        ref: console
